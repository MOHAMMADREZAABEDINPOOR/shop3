<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bg_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c2340"/>
    </linearGradient>
    <linearGradient id="accent_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow_blue" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft_blue" cx="15%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0c2340" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardSh_blue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="28" fill="url(#bg_blue)"/>
  <rect width="1200" height="480" rx="28" fill="url(#glow_blue)"/>
  <rect width="1200" height="480" rx="28" fill="url(#glowLeft_blue)"/>

  <!-- Geometric Abstract Design Elements -->
  <g opacity="0.18">
    <circle cx="1020" cy="240" r="190" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10 12"/>
    <circle cx="1020" cy="240" r="130" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="1020" cy="240" r="70" fill="url(#accent_blue)" opacity="0.6"/>
  </g>

  <!-- Badge Tag -->
  <g transform="translate(64, 56)">
    <rect width="210" height="38" rx="19" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <circle cx="20" cy="19" r="6" fill="#38bdf8"/>
    <text x="36" y="24" font-size="13" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700">جدیدترین‌ها</text>
  </g>

  <!-- Main Typography -->
  <text x="64" y="160" font-size="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900">موبایل و تبلت با گارانتی شرکتی</text>
  
  <text x="64" y="210" font-size="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" opacity="0.92">پرچمداران اپل، سامسونگ و شیائومی با تحویل فوری</text>

  <!-- Visual Card Accent on Right -->
  <g transform="translate(860, 100)" filter="url(#cardSh_blue)">
    <rect width="260" height="280" rx="24" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="130" cy="110" r="54" fill="url(#accent_blue)"/>
    <circle cx="130" cy="110" r="64" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    
    <text x="130" y="210" font-size="18" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">NEXTSHOP</text>
    <text x="130" y="235" font-size="13" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700">PREMIUM SELECTION</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(64, 410)">
    <circle cx="8" cy="8" r="4" fill="#38bdf8"/>
    <text x="24" y="12" font-size="13" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">ضمانت اصالت ۱۰۰٪ کالای اورجینال</text>
    
    <circle cx="280" cy="8" r="4" fill="#38bdf8"/>
    <text x="296" y="12" font-size="13" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">ارسال سریع سراسری</text>

    <circle cx="480" cy="8" r="4" fill="#38bdf8"/>
    <text x="496" y="12" font-size="13" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">۷ روز ضمانت بازگشت کالا</text>
  </g>
</svg>